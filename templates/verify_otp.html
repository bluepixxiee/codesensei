<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP - ascend</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #05010f; --surface: #0d0a1a; --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.13); --accent: #6366f1; --accent2: #a78bfa;
      --text: #f5f3ee; --muted: #6b7280; --muted2: #9ca3af;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 500px; height: 500px; background: rgba(99,102,241,0.1); top: -150px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(167,139,250,0.07); bottom: -100px; right: -100px; }
    .card { position: relative; z-index: 1; width: 100%; max-width: 420px; background: rgba(255,255,255,0.01); border-radius: 24px; padding: 40px; animation: fadeUp 0.5s ease both; }
    .card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.05) 80%, rgba(255,255,255,0.15) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    .logo { font-family: 'General Sans', sans-serif; font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .logo span { color: var(--accent2); }
    .email-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
    h1 { font-family: 'General Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; text-align: center; }
    .sub { font-size: 14px; color: var(--muted2); margin-bottom: 32px; line-height: 1.6; text-align: center; }
    .sub span { color: var(--accent2); font-weight: 500; }

    /* OTP INPUT */
    .otp-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .otp-input { width: 52px; height: 60px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 12px; text-align: center; font-size: 24px; font-weight: 700; font-family: 'General Sans', sans-serif; color: var(--text); outline: none; transition: all 0.2s; caret-color: var(--accent2); }
    .otp-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .otp-input.filled { border-color: var(--accent2); color: var(--accent2); }

    .btn { width: 100%; padding: 13px; border: none; border-radius: 100px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; box-shadow: 0 4px 24px rgba(99,102,241,0.3); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(99,102,241,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #fb7185; margin-bottom: 16px; display: none; text-align: center; }
    .success-msg { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #34d399; margin-bottom: 16px; display: none; text-align: center; }

    .resend-wrap { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted2); }
    .resend-btn { color: var(--accent2); background: none; border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
    .resend-btn:hover { text-decoration: underline; }
    .resend-btn:disabled { color: var(--muted); cursor: not-allowed; text-decoration: none; }

    .timer { color: var(--accent2); font-weight: 500; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Code<span>Sensei</span>
  </div>

  <div class="email-icon">📧</div>
  <h1>Check your email</h1>
  <p class="sub">
    We sent a 6-digit OTP to your email.<br>
    Enter it below to
    <span>{% if purpose == 'signup' %}verify your account{% else %}log in{% endif %}</span>.
  </p>

  <div class="error" id="errorBox"></div>
  <div class="success-msg" id="successBox"></div>

  <div class="otp-inputs">
    <input class="otp-input" type="text" maxlength="1" id="otp0" onkeyup="handleOtp(event, 0)">
    <input class="otp-input" type="text" maxlength="1" id="otp1" onkeyup="handleOtp(event, 1)">
    <input class="otp-input" type="text" maxlength="1" id="otp2" onkeyup="handleOtp(event, 2)">
    <input class="otp-input" type="text" maxlength="1" id="otp3" onkeyup="handleOtp(event, 3)">
    <input class="otp-input" type="text" maxlength="1" id="otp4" onkeyup="handleOtp(event, 4)">
    <input class="otp-input" type="text" maxlength="1" id="otp5" onkeyup="handleOtp(event, 5)">
  </div>

  <button class="btn" id="verifyBtn" onclick="verifyOtp()">Verify OTP</button>

  <div class="resend-wrap">
    Didn't receive it?
    <button class="resend-btn" id="resendBtn" onclick="resendOtp()" disabled>
      Resend in <span class="timer" id="timerDisplay">60s</span>
    </button>
  </div>
</div>

<script>
  const purpose = "{{ purpose }}";
  let timerInterval;
  let seconds = 60;

  // start countdown
  function startTimer() {
    seconds = 60;
    document.getElementById("resendBtn").disabled = true;
    timerInterval = setInterval(() => {
      seconds--;
      document.getElementById("timerDisplay").textContent = seconds + "s";
      if (seconds <= 0) {
        clearInterval(timerInterval);
        document.getElementById("resendBtn").disabled = false;
        document.getElementById("resendBtn").innerHTML = "Resend OTP";
      }
    }, 1000);
  }

  startTimer();

  // OTP input handling
  function handleOtp(event, index) {
    const input = document.getElementById("otp" + index);
    const value = input.value;

    // only allow digits
    input.value = value.replace(/[^0-9]/g, '');

    if (input.value) {
      input.classList.add("filled");
      // move to next input
      if (index < 5) {
        document.getElementById("otp" + (index + 1)).focus();
      } else {
        // auto verify when last digit entered
        verifyOtp();
      }
    } else {
      input.classList.remove("filled");
    }

    // handle backspace
    if (event.key === "Backspace" && !input.value && index > 0) {
      document.getElementById("otp" + (index - 1)).focus();
    }
  }

  function getOtpValue() {
    let otp = "";
    for (let i = 0; i < 6; i++) {
      otp += document.getElementById("otp" + i).value;
    }
    return otp;
  }

  async function verifyOtp() {
    const otp = getOtpValue();
    const errorBox = document.getElementById("errorBox");
    const btn = document.getElementById("verifyBtn");

    if (otp.length !== 6) {
      errorBox.textContent = "Please enter all 6 digits.";
      errorBox.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Verifying...";
    errorBox.style.display = "none";

    try {
      const res = await fetch("/verify-otp/" + purpose, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ otp })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById("successBox").textContent = "✓ Verified! Redirecting...";
        document.getElementById("successBox").style.display = "block";
        setTimeout(() => { window.location.href = data.redirect; }, 1000);
      } else {
        errorBox.textContent = data.error;
        errorBox.style.display = "block";
        // clear inputs on error
        for (let i = 0; i < 6; i++) {
          document.getElementById("otp" + i).value = "";
          document.getElementById("otp" + i).classList.remove("filled");
        }
        document.getElementById("otp0").focus();
        btn.disabled = false;
        btn.textContent = "Verify OTP";
      }
    } catch(e) {
      errorBox.textContent = "Something went wrong. Try again.";
      errorBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Verify OTP";
    }
  }

  async function resendOtp() {
    const successBox = document.getElementById("successBox");
    const errorBox = document.getElementById("errorBox");

    try {
      const res = await fetch("/resend-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ purpose })
      });
      const data = await res.json();

      if (data.success) {
        successBox.textContent = "✓ OTP resent! Check your email.";
        successBox.style.display = "block";
        errorBox.style.display = "none";
        startTimer();
        setTimeout(() => { successBox.style.display = "none"; }, 3000);
      } else {
        errorBox.textContent = data.error;
        errorBox.style.display = "block";
      }
    } catch(e) {
      errorBox.textContent = "Failed to resend OTP.";
      errorBox.style.display = "block";
    }
  }

  // focus first input on load
  document.getElementById("otp0").focus();
</script>
</body>
</html>
