<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign up — Ascend</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; min-height: 100vh;
    }
    .back-link {
      position: fixed; top: 24px; left: 24px;
      color: var(--white-60); text-decoration: none;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.2s; z-index: 10;
    }
    .back-link:hover { color: var(--gold); }

    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: rgba(13, 14, 26, 0.85);
      border-radius: 20px; padding: 40px 36px;
      border: 1px solid var(--white-10);
      backdrop-filter: blur(16px);
      animation: fadeUp 0.5s ease both;
    }
    .auth-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, rgba(232, 163, 61, 0.4), rgba(124, 58, 237, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    .auth-logo {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 24px; text-decoration: none;
    }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--white-60); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--white-10);
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      padding: 13px 16px; color: var(--white);
      font-size: 14px; font-family: 'Lexend', sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--white-40); }

    .error-box {
      background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3);
      border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #fb7185;
      margin-bottom: 18px; display: none; font-weight: 600;
    }

    .switch-text { text-align: center; font-size: 13px; color: var(--white-60); margin-top: 20px; }
    .switch-text a { color: var(--gold); text-decoration: none; font-weight: 700; }
    .switch-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb-gold"></div>
<div class="orb orb-purple"></div>

<a href="/" class="back-link">← Back to home</a>

<div class="auth-card">
  <a href="/" class="auth-logo">
    <div class="nav-logo-mark">⚡</div>
    <span class="nav-logo-text">ASCEND</span>
  </a>

  <h1 style="font-size:24px; font-weight:800; text-align:center; margin-bottom:6px; letter-spacing:-0.5px;">Create an Account</h1>
  <p style="font-size:13px; color:var(--white-60); text-align:center; margin-bottom:28px;">Start receiving AI code reviews and leveling up.</p>

  <div class="error-box" id="errorBox"></div>

  <form id="signupForm" onsubmit="handleSignup(event)">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Alex Rivers" required/>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required/>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required/>
    </div>

    <button type="submit" class="btn-cyber btn-gold btn-large" id="signupBtn" style="margin-top:10px;">
      Create Account →
    </button>
  </form>

  <div class="switch-text">
    Already have an account? <a href="/login">Log in</a>
  </div>
</div>

<script>
  async function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('signupBtn');
    const err = document.getElementById('errorBox');

    btn.disabled = true;
    btn.textContent = '⏳ Creating Account...';
    err.style.display = 'none';

    try {
      const res = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (!data.success) {
        err.textContent = data.error || 'Signup failed.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account →';
        return;
      }

      window.location.href = data.redirect || '/verify-otp/signup';
    } catch(errEx) {
      err.textContent = 'Something went wrong: ' + errEx.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account →';
    }
  }
</script>
</body>
</html>
