<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email — Ascend</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; min-height: 100vh;
    }

    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: rgba(13, 14, 26, 0.85);
      border-radius: 20px; padding: 40px 36px;
      border: 1px solid var(--white-10);
      backdrop-filter: blur(16px);
      animation: fadeUp 0.5s ease both;
    }
    .auth-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, rgba(232, 163, 61, 0.4), rgba(124, 58, 237, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    .auth-logo {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 24px; text-decoration: none;
    }

    .otp-grid { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .otp-input {
      width: 52px; height: 58px; text-align: center; font-size: 22px; font-weight: 800;
      background: var(--surface2); border: 1px solid var(--white-10);
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      color: var(--gold); outline: none; transition: all 0.2s;
      font-family: 'Lexend', sans-serif;
    }
    .otp-input:focus { border-color: var(--gold); box-shadow: 0 0 16px rgba(232, 163, 61, 0.3); }

    .error-box {
      background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3);
      border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #fb7185;
      margin-bottom: 18px; display: none; font-weight: 600; text-align: center;
    }

    .success-box {
      background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #34d399;
      margin-bottom: 18px; display: none; font-weight: 600; text-align: center;
    }

    .resend-box { text-align: center; margin-top: 20px; font-size: 13px; color: var(--white-60); }
    .resend-btn { background: none; border: none; color: var(--gold); font-weight: 700; cursor: pointer; text-decoration: underline; font-family: 'Lexend', sans-serif; }
    .resend-btn:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: none; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb-gold"></div>
<div class="orb orb-purple"></div>

<div class="auth-card">
  <a href="/" class="auth-logo">
    <div class="nav-logo-mark">⚡</div>
    <span class="nav-logo-text">ASCEND</span>
  </a>

  <h1 style="font-size:24px; font-weight:800; text-align:center; margin-bottom:6px; letter-spacing:-0.5px;">Check Your Inbox</h1>
  <p style="font-size:13px; color:var(--white-60); text-align:center; margin-bottom:28px;">
    We sent a 6-digit OTP code to <strong style="color:var(--white);">{{ session.get('pending_email', 'your email') }}</strong>.
  </p>

  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <form id="otpForm" onsubmit="handleVerify(event)">
    <div class="otp-grid">
      <input type="text" maxlength="1" class="otp-input" id="otp-0" autofocus onkeyup="moveFocus(0, event)"/>
      <input type="text" maxlength="1" class="otp-input" id="otp-1" onkeyup="moveFocus(1, event)"/>
      <input type="text" maxlength="1" class="otp-input" id="otp-2" onkeyup="moveFocus(2, event)"/>
      <input type="text" maxlength="1" class="otp-input" id="otp-3" onkeyup="moveFocus(3, event)"/>
      <input type="text" maxlength="1" class="otp-input" id="otp-4" onkeyup="moveFocus(4, event)"/>
      <input type="text" maxlength="1" class="otp-input" id="otp-5" onkeyup="moveFocus(5, event)"/>
    </div>

    <button type="submit" class="btn-cyber btn-gold btn-large" id="verifyBtn">
      Verify Code →
    </button>
  </form>

  <div class="resend-box">
    Didn't get code? <button class="resend-btn" id="resendBtn" onclick="resendOtp()">Resend OTP</button>
    <span id="timerText" style="display:none; color:var(--white-40); margin-left:4px;">(in 30s)</span>
  </div>
</div>

<script>
  function moveFocus(idx, e) {
    const inputs = document.querySelectorAll('.otp-input');
    if (e.key === 'Backspace' && idx > 0 && !inputs[idx].value) {
      inputs[idx - 1].focus();
    } else if (inputs[idx].value && idx < 5) {
      inputs[idx + 1].focus();
    }
  }

  async function handleVerify(e) {
    e.preventDefault();
    const inputs = document.querySelectorAll('.otp-input');
    let otp = '';
    inputs.forEach(inp => otp += inp.value);

    if (otp.length < 6) {
      showError('Please enter all 6 digits.');
      return;
    }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Verifying...';

    try {
      const res = await fetch('/verify-otp/{{ mode }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp })
      });
      const data = await res.json();

      if (!data.success) {
        showError(data.error || 'Invalid OTP');
        btn.disabled = false;
        btn.textContent = 'Verify Code →';
        return;
      }

      showSuccess('Email verified! Redirecting...');
      setTimeout(() => {
        window.location.href = data.redirect || '/dashboard';
      }, 1000);

    } catch(errEx) {
      showError('Error: ' + errEx.message);
      btn.disabled = false;
      btn.textContent = 'Verify Code →';
    }
  }

  async function resendOtp() {
    const btn = document.getElementById('resendBtn');
    const timerText = document.getElementById('timerText');
    btn.disabled = true;

    try {
      const res = await fetch('/resend-otp', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        showSuccess('New OTP code sent!');
        startCooldown();
      } else {
        showError(data.error || 'Failed to resend.');
        btn.disabled = false;
      }
    } catch(e) {
      showError('Error: ' + e.message);
      btn.disabled = false;
    }
  }

  function startCooldown() {
    const btn = document.getElementById('resendBtn');
    const timerText = document.getElementById('timerText');
    let left = 30;
    timerText.style.display = 'inline';
    timerText.textContent = `(in ${left}s)`;

    const interval = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(interval);
        btn.disabled = false;
        timerText.style.display = 'none';
      } else {
        timerText.textContent = `(in ${left}s)`;
      }
    }, 1000);
  }

  function showError(msg) {
    const err = document.getElementById('errorBox');
    const succ = document.getElementById('successBox');
    succ.style.display = 'none';
    err.textContent = msg;
    err.style.display = 'block';
  }

  function showSuccess(msg) {
    const err = document.getElementById('errorBox');
    const succ = document.getElementById('successBox');
    err.style.display = 'none';
    succ.textContent = msg;
    succ.style.display = 'block';
  }
</script>
</body>
</html>
