<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log in — CodeSensei</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #05010f; --surface: #0d0a1a; --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.13); --accent: #6366f1; --accent2: #a78bfa;
      --text: #f5f3ee; --muted: #6b7280; --muted2: #9ca3af;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 500px; height: 500px; background: rgba(99,102,241,0.1); top: -150px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(167,139,250,0.07); bottom: -100px; right: -100px; }
    .back { position: fixed; top: 24px; left: 24px; color: var(--muted2); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: color 0.2s; z-index: 10; }
    .back:hover { color: var(--text); }
    .card { position: relative; z-index: 1; width: 100%; max-width: 420px; background: rgba(255,255,255,0.01); border-radius: 24px; padding: 40px; animation: fadeUp 0.5s ease both; }
    .card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.05) 80%, rgba(255,255,255,0.15) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    .logo { font-family: 'General Sans', sans-serif; font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .logo span { color: var(--accent2); }
    h1 { font-family: 'General Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--muted2); margin-bottom: 32px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 10px; padding: 13px 16px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    input::placeholder { color: var(--muted); }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 100px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; box-shadow: 0 4px 24px rgba(99,102,241,0.3); margin-top: 8px; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(99,102,241,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #fb7185; margin-bottom: 16px; display: none; }
    .divider { text-align: center; font-size: 13px; color: var(--muted); margin: 20px 0; }
    .switch-link { text-align: center; font-size: 14px; color: var(--muted2); }
    .switch-link a { color: var(--accent2); text-decoration: none; font-weight: 500; }
    .switch-link a:hover { text-decoration: underline; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<a href="/" class="back">← Back</a>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Code<span>Sensei</span>
  </div>
  <h1>Welcome back</h1>
  <p class="sub">Log in to continue improving your code.</p>
  <div class="error" id="errorBox"></div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()"/>
  </div>
  <button class="btn" id="loginBtn" onclick="login()">Log in</button>
  <div class="divider">— or —</div>
  <div class="switch-link">Don't have an account? <a href="/signup">Sign up free</a></div>
</div>

<script>
  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("errorBox");
    const btn = document.getElementById("loginBtn");
    if (!email || !password) { errorBox.textContent = "Please fill in all fields."; errorBox.style.display = "block"; return; }
    btn.disabled = true; btn.textContent = "Logging in..."; errorBox.style.display = "none";
    try {
      const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
      const data = await res.json();
      if (data.success) { window.location.href = "/dashboard"; }
      else { errorBox.textContent = data.error; errorBox.style.display = "block"; btn.disabled = false; btn.textContent = "Log in"; }
    } catch(e) { errorBox.textContent = "Something went wrong."; errorBox.style.display = "block"; btn.disabled = false; btn.textContent = "Log in"; }
  }
</script>
</body>
</html>
